<html>
  <head>
    <title>Test Harness</title>
    <script>
    function showToast(myString) {
      console.log(myString);
      try {
        EDJAndroid.showToast(myString);
      } catch (error) {
        console.log(myString + " - ERROR : " + error);
      }
    }
      
    function storeToken(myString) {
      console.log(myString);
      try {
        EDJAndroid.storeToken(myString);
      } catch (error) {
        console.log(myString + " - ERROR : " + error);
      }   
       document.getElementById('random_val').innerHTML = "Hello Earth";
    }  
      
    function retrieveToken(myString) {
      console.log(myString);
      let impVal = "waiting...";
      try {
        impVal = EDJAndroid.retrieveToken(myString);
         document.getElementById('random_val').innerHTML = impVal 
      } catch (error) {
        console.log(myString + " - ERROR : " + error);
      } 
       console.log("completed retrieve");
    }   
    </script>
</head>
<body>
<h3>Android Webview Interface test harness D</h3>

<p id="title">Choose your action:</p>
<input type="button" id="input_button" value="Show Toast button" onClick="javascript:showToast('Show Toast button click')" />
<br /><br />
<button onClick="javascript:storeToken('Store Token button click')">Set Token button</button>
<br /><br />
<button onClick="javascript:retrieveToken('Retrieve Token button click')">Retrieve Token button</button>
<br /><br />
<button onClick="javascript:performNativeAction('Perform Native action')">Native Action button</button>
<br /><br />
<p id="random_val">_</p>  

<br /><br />
<button id="back-btn">Back button</button>
<br /><br />
<button id="next-btn">Next button</button>

</body>
</html>
